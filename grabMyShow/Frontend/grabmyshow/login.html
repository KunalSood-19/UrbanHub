<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrabMyShow Login</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
}

/* Login Card */

.login-container{
background:white;
padding:40px 35px;
width:350px;
border-radius:14px;
box-shadow:0 15px 40px rgba(0,0,0,0.25);
text-align:center;
}

/* Logo */

.logo{
font-size:30px;
font-weight:600;
margin-bottom:25px;
}

.logo span{
color:#ff4b2b;
}

/* Heading */

h2{
margin-bottom:20px;
color:#333;
}

/* Inputs */

input{
width:100%;
padding:13px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
transition:0.3s;
}

input:focus{
border-color:#ff4b2b;
outline:none;
box-shadow:0 0 5px rgba(255,75,43,0.3);
}

/* Button */

button{
width:100%;
padding:13px;
margin-top:15px;
border:none;
border-radius:8px;
background:#ff4b2b;
color:white;
font-size:16px;
font-weight:500;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#e23e22;
}

/* Register Link */

.register{
margin-top:15px;
font-size:14px;
}

.register a{
color:#ff4b2b;
text-decoration:none;
font-weight:500;
}

.register a:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<div class="login-container">


<h2>Login</h2>

<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="login()">Login</button>

<div class="register">
Don't have an account? <a href="register.html">Register</a>
</div>

</div>

<script src="../js/login.js"></script>

</body>
</html>
