<!DOCTYPE html>
<html>
<head>
<title>Create Account</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#141e30,#243b55);
}

/* Card */

.container{
background:white;
padding:40px 35px;
width:360px;
border-radius:14px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,0.3);
}

/* Logo */

.logo{
font-size:30px;
font-weight:600;
margin-bottom:20px;
}

.logo span{
color:#ff4b2b;
}

/* Heading */

h3{
margin-bottom:20px;
color:#333;
}

/* Inputs */

input{
width:100%;
padding:13px;
margin:10px 0;
border-radius:8px;
border:1px solid #ddd;
font-size:14px;
transition:0.3s;
}

input:focus{
border-color:#ff4b2b;
outline:none;
box-shadow:0 0 6px rgba(255,75,43,0.3);
}

/* Button */

button{
width:100%;
padding:13px;
margin-top:12px;
border:none;
border-radius:8px;
background:#ff4b2b;
color:white;
font-size:16px;
font-weight:500;
cursor:pointer;
transition:0.3s;
}

button:hover{
background:#e23e22;
}

/* Link */

.link{
margin-top:18px;
font-size:14px;
}

.link a{
color:#ff4b2b;
text-decoration:none;
font-weight:500;
}

.link a:hover{
text-decoration:underline;
}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Urban<span>Hub</span>
</div>

<h3>Create Account</h3>

<input type="text" id="name" placeholder="Enter Name">
<input type="email" id="email" placeholder="Enter Email">
<input type="password" id="password" placeholder="Enter Password">

<button onclick="register()">Create Account</button>

<div class="link">
Already have an account? 
<a href="login.html">Login</a>
</div>

</div>
<script>
async function register() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if (!name || !email || !password) {
    alert("Sabhi fields bharo!");
    return;
  }

  try {
    const res = await fetch("https://grabmyshow-backend.onrender.com/api/auth/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, email, password })
    });

    const data = await res.json();
    const message = data.message || data.error || "Something went wrong";

    alert(message);

    // ✅ Safe check
    if (res.ok && message.includes("Successfully")) {
      window.location.href = "login.html";
    }

  } catch (err) {
    console.error(err);
    alert("Server se connection nahi ho pa raha");
  }
}
</script>

</body>
</html>
