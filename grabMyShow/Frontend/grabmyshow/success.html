<!DOCTYPE html>
<html>
<head>
<title>Booking Confirmed</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Poppins",sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

/* MAIN TICKET */

.ticket{
background:#020617;
border:1px solid #1e293b;
padding:40px;
border-radius:14px;
width:400px;
text-align:center;
box-shadow:0 20px 40px rgba(0,0,0,0.6);
}

.success-icon{
font-size:50px;
margin-bottom:15px;
color:#22c55e;
}

.ticket h2{
margin-bottom:20px;
font-weight:600;
}

.ticket-info{
background:#0f172a;
border-radius:8px;
padding:18px;
margin-bottom:20px;
text-align:left;
}

.ticket-info p{
margin-bottom:10px;
color:#cbd5f5;
}

.ticket-info span{
color:#38bdf8;
font-weight:500;
}

button{
background:#38bdf8;
border:none;
padding:12px 25px;
color:black;
border-radius:6px;
cursor:pointer;
font-weight:600;
transition:0.3s;
margin:5px;
}

button:hover{
background:#0ea5e9;
}

.note{
font-size:12px;
margin-top:15px;
color:#94a3b8;
}

.do{
    background-color: orange;
}
</style>
</head>

<body>

<div class="ticket">

<div class="success-icon">🎉</div>

<h2>Booking Confirmed</h2>

<div class="ticket-info">

<p><b>Movie:</b> <span id="movieName"></span></p>
<p><b>Venue:</b> <span id="venue"></span></p>
<p><b>Date:</b> <span id="date"></span></p>
<p><b>Time:</b> <span id="time"></span></p>
<p><b>Show ID:</b> <span id="showId"></span></p>
<p><b>Seats:</b> <span id="seats"></span></p>
<p><b>Total Paid:</b> ₹<span id="amount"></span></p>

</div>

<button onclick="goHome()">Go To Home</button>
<button onclick="downloadTicket()">Download Ticket</button>
<button class="do"><a href="https://grabmyshow-backend.onrender.com/dine-order" class="dine-btn">🍽 Dine Out</a></button>
<p class="note">Enjoy your movie! 🍿</p>

</div>

<script>

// 🎯 GET DATA FROM LOCAL STORAGE
const seats = JSON.parse(localStorage.getItem("bookedSeats")) || [];
const amount = localStorage.getItem("totalAmount") || 0;
const showId = localStorage.getItem("showId") || "";
const movieName = localStorage.getItem("movieName") || "";
const venue = localStorage.getItem("venue") || "";
const date = localStorage.getItem("date") || "";
const time = localStorage.getItem("time") || "";

// 🎯 SET UI
document.getElementById("seats").innerText = seats.join(", ");
document.getElementById("amount").innerText = amount;
document.getElementById("showId").innerText = showId;
document.getElementById("movieName").innerText = movieName;
document.getElementById("venue").innerText = venue;
document.getElementById("date").innerText = date;
document.getElementById("time").innerText = time;

// 🚀 NAVIGATION
function goHome(){
  window.location.href="../../../landing-page/index.html";
}

// 🎟 PDF DOWNLOAD
function downloadTicket(){

const { jsPDF } = window.jspdf;
const doc = new jsPDF();

/* Background */
doc.setFillColor(15,23,42);
doc.rect(0,0,210,297,"F");

/* Title */
doc.setTextColor(56,189,248);
doc.setFontSize(22);
doc.text("GrabMyShow Ticket",60,30);

/* Success */
doc.setTextColor(255,255,255);
doc.setFontSize(16);
doc.text("Booking Confirmed 🎉",60,45);

/* Box */
doc.setDrawColor(56,189,248);
doc.rect(20,60,170,110);

/* Details */
doc.setFontSize(13);

doc.text("Movie: " + movieName,30,80);
doc.text("Venue: " + venue,30,95);
doc.text("Date: " + date,30,110);
doc.text("Time: " + time,30,125);
doc.text("Seats: " + seats.join(", "),30,140);
doc.text("Total Paid: ₹" + amount,30,155);

/* Footer */
doc.setFontSize(12);
doc.text("Enjoy your movie 🍿",70,190);

/* Save */
doc.save("grabmyshow-ticket.pdf");

}
</script>

</body>
</html>
